[project]
name = "betriebspilot-agent-backend"
version = "0.1.0"
description = "Autonomous Back-Office Agent for Legacy German ERPs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BetriebsPilot AI Team" }
]
dependencies = [
    # API Server & Streaming
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",

    # AI Agent & Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "instructor>=1.3.0",
    "openai>=1.30.0",

    # Vector Search & Embeddings
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",

    # Ingestion & Parsing
    "docling>=2.0.0",
    "pypdf>=4.0.0",

    # Database & ORM
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",

    # Utilities, XML & Seeding
    "lxml>=5.2.0",
    "faker>=25.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
