version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL: Transactional Store for ERP Master Data, Orders & Audit Trails
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: betriebspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betriebspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betriebspilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-betriebspilot_erp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betriebspilot} -d ${POSTGRES_DB:-betriebspilot_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Qdrant: Hybrid Vector Search (Dense + BM25 Sparse) for SKU Resolution
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: betriebspilot-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Optional Containerized Ollama (Use 'docker compose --profile llm up' to start)
  # NOTE: On Apple Silicon Macs, running native Ollama natively via 'brew install ollama'
  # provides 5-10x faster Metal GPU acceleration than containerized Docker VM.
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: betriebspilot-ollama
    restart: unless-stopped
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
